name: Suggest an idea
description: Share an idea or an improvement for The Backrooms.
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ideas are very welcome — a new level, a creature, a mechanic, or a small
        quality-of-life change. Describe what you would like to see and why.
  - type: textarea
    id: idea
    attributes:
      label: What is your idea?
      placeholder: It would be great if the game had...
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What would it improve?
      description: Tell us what feels missing, unfair, or scary in the wrong way today.
      placeholder: Right now..., and this would...
    validations:
      required: false
  - type: textarea
    id: more
    attributes:
      label: Anything else?
      description: Examples, references, or links are welcome.
    validations:
      required: false
